version: '2.6'
services:
  player:
    tty: true
    image: demsking/oremi-player
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
    ports:
      - 3765:3765
  snapcast-player:
    tty: true
    image: demsking/oremi-player
    environment:
      ENABLE_SNAPCAST: 'true'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
    ports:
      - 26680:6680
  snapserver:
    build:
      context: snapserver
    image: snapserver
    volumes:
      - /tmp/snapfifo:/tmp/snapfifo
      - /etc/localtime:/etc/localtime:ro
      - ~/.local/oremi/snapserver:/var/lib/snapserver
    ports:
      - 21705:1705
      - 21704:1704
      - 21780:1780
  snapclient:
    build:
      context: snapclient
    image: snapclient
    privileged: true
    hostname: 'Oremi Engine'
    environment:
      SNAPCAST_HOST: snapserver
      SNAPCAST_PORT: 1704
      SNAPCAST_DEVICE: sysdefault
    volumes:
      - /dev/snd:/dev/snd
      - /etc/localtime:/etc/localtime:ro
