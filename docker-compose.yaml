version: '2.6'
services:
  player:
    tty: true
    build:
      context: .
      dockerfile: player.Dockerfile
    image: player
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ~/.local/oremi/player/data:/var/lib/mopidy/data
      - ~/.cache/oremi/player/cache:/var/lib/mopidy/cache
      - ~/Media/:/media
    ports:
      - 56680:36680
  snapcast-player:
    tty: true
    build:
      context: .
      dockerfile: player.Dockerfile
    image: player
    environment:
      ENABLE_SNAPCAST: 'true'
    volumes:
      - /tmp/snapfifo:/tmp/snapfifo
      - /etc/localtime:/etc/localtime:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ~/.local/oremi/snapcast-player/data:/var/lib/mopidy/data
      - ~/.cache/oremi/snapcast-player/cache:/var/lib/mopidy/cache
      - ~/Media/:/media
    ports:
      - 46680:36680
  snapcast:
    tty: true
    build:
      context: .
      dockerfile: snapcast.Dockerfile
    image: snapcast
    volumes:
      - /tmp/snapfifo:/tmp/snapfifo
      - /etc/localtime:/etc/localtime:ro
      - ~/.local/oremi/snapserver:/var/lib/snapserver
    ports:
      - 41705:31705
      - 41704:31704
      - 41780:31780
