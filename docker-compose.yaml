version: '2.6'
services:
  player:
    tty: true
    build:
      context: ./player
    image: player
    privileged: true
    working_dir: /app
    volumes:
      - ./player/app:/app
      - /etc/localtime:/etc/localtime:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ~/Media/:/media
    ports:
      - 3765:3765
