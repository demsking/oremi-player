version: '2.6'
services:
  player:
    build: .
    image: oremi-player:1.0.0
    tty: true
    privileged: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ~/.local/snapserver:/var/lib/snapserver
      - ~/.local/mobidy/data:/var/lib/mopidy/data
      - ~/.cache/mobidy:/var/lib/mopidy/cache
      - ~/Music/:/media
    ports:
      - 36680:36680
      - 31780:31780
      - 31705:31705
      - 31704:31704
